name: Publish TOB APK

on:
  push:
    paths:
      - 'tob/TOB-latest.apk.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode APK
        run: base64 -d tob/TOB-latest.apk.b64 > tob/TOB-latest.apk
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tob/TOB-latest.apk
          git diff --cached --quiet || git commit -m "Publish latest TOB APK"
          git push
