name: Cortex Bourse Android beta APK
on:
  push:
    branches: [cortex-bourse-apk]
    paths:
      - 'cortex-android-source.b64'
      - '.github/workflows/build-cortex-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Android source
        run: |
          base64 -d cortex-android-source.b64 > /tmp/cortex-source.zip
          unzip -q /tmp/cortex-source.zip
          test -f cortex-android/app/src/main/AndroidManifest.xml
      - name: Verify phase 1 manual-only code and SQLite contracts
        run: cd cortex-android && python3 -m unittest discover -s tests -v
      - name: Build
        run: cd cortex-android && gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s cortex-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum cortex-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable beta
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Bourse-Android-beta-APK
          path: cortex-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Validate real TSETMC session prices and stock flow
        run: cd cortex-android && python3 test_live.py
