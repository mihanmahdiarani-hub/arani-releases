name: Bootstrap ARANI 1.9.6 Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed build artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-3408-81fd-9679-4c35b81f4845/raw?se=2026-09-30T09%3A00%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=cd1309cb-f611-5f35-95c1-a6b79283dcb3&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T07%3A47%3A51Z&ske=2026-10-01T07%3A47%3A51Z&sks=b&skv=2026-02-06&sig=otDhDs41bIyZJGaVduVBdyyuHLsBQtCBhnMYPT/jkcw%3D"
        run: |
          curl -fL "$ARTIFACT_URL" -o arani.zip
          unzip -o arani.zip
          test -f ARANI-v1.9.6.apk
          test -f ARANI-v1.9.6.apk.sha256
          sha256sum -c ARANI-v1.9.6.apk.sha256

      - name: Publish v1.9.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.6 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists."
          else
            gh release create v1.9.6               ARANI-v1.9.6.apk               ARANI-v1.9.6.apk.sha256               --repo "${{ github.repository }}"               --title "ARANI v1.9.6"               --notes "نسخه پایه بروزرسانی درون‌برنامه‌ای ARANI"
          fi
