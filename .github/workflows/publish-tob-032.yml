name: Publish TOB 0.3.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-tob-032.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout releases repo
        uses: actions/checkout@v4

      - name: Download built TOB artifact
        env:
          ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-1014-81f5-9ae1-d14233b2d15e/raw?se=2026-10-04T14%3A38%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=ac24e643-2bd8-5db8-b286-5db00ab2bfd1&skoid=6174e06a-818a-4ff5-b6f0-d683c3377d0a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T19%3A08%3A13Z&ske=2026-10-04T19%3A08%3A13Z&sks=b&skv=2026-02-06&sig=XU2bhKI%2BgnGi/2JsQaCJBfiTCmQYP8yxUXi%2B2eQ6YBU%3D"
        run: |
          python - <<'PY'
          import os, urllib.request
          urllib.request.urlretrieve(os.environ['ARTIFACT_URL'], 'artifact.zip')
          PY
          rm -rf artifact
          mkdir artifact
          unzip -o artifact.zip -d artifact
          test -f artifact/app-debug.apk

      - name: Publish APK and update manifest
        run: |
          mkdir -p tob
          cp artifact/app-debug.apk tob/TOB-0.3.2.apk
          cp artifact/app-debug.apk tob/TOB-latest.apk
          python - <<'PY'
          import json
          data = {
            'versionCode': 5,
            'versionName': '0.3.2',
            'downloadUrl': 'https://raw.githubusercontent.com/mihanmahdiarani-hub/arani-releases/main/tob/TOB-latest.apk',
            'notes': 'TOB 0.3.2: رفع خطای Veo HTTP 400 با ارسال durationSeconds به‌صورت عددی؛ ساخت ویدیوی 9:16 با Veo 3.1.'
          }
          with open('tob/latest.json', 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
            f.write('\n')
          PY

      - name: Commit release files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tob/TOB-0.3.2.apk tob/TOB-latest.apk tob/latest.json
          git commit -m 'Publish TOB 0.3.2' || exit 0
          git push
